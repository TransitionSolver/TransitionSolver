# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13.18"
    - name: Install apt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git cmake libalglib-dev libnlopt-cxx-dev libeigen3-dev \
          libboost-filesystem-dev libboost-log-dev libgsl-dev \
          numdiff fonts-dejavu ghostscript
    - name: Install TransitionSolver and test dependencies
      run: python -m pip install -vvv --no-cache-dir .[test]
    - name: Diagnose Eigen ABI
      run: |
        python - <<'PY'
        import os

        from TransitionSolver import action

        cppyy = action.cppyy
        cppyy.cppdef(r"""
        int ts_eigen_max_align() { return EIGEN_MAX_ALIGN_BYTES; }
        int ts_eigen_static_align() { return EIGEN_MAX_STATIC_ALIGN_BYTES; }
        int ts_eigen_default_align() { return EIGEN_DEFAULT_ALIGN_BYTES; }
        int ts_eigen_malloc_aligned() { return EIGEN_MALLOC_ALREADY_ALIGNED; }
        int ts_eigen_dont_vectorize() {
        #ifdef EIGEN_DONT_VECTORIZE
          return 1;
        #else
          return 0;
        #endif
        }
        int ts_glibc_version() {
        #ifdef __GLIBC__
          return 100 * __GLIBC__ + __GLIBC_MINOR__;
        #else
          return -1;
        #endif
        }
        """)
        print("EXTRA_CLING_ARGS=", os.environ.get("EXTRA_CLING_ARGS"))
        print("Cling EIGEN_MAX_ALIGN_BYTES=", cppyy.gbl.ts_eigen_max_align())
        print("Cling EIGEN_MAX_STATIC_ALIGN_BYTES=", cppyy.gbl.ts_eigen_static_align())
        print("Cling EIGEN_DEFAULT_ALIGN_BYTES=", cppyy.gbl.ts_eigen_default_align())
        print("Cling EIGEN_MALLOC_ALREADY_ALIGNED=", cppyy.gbl.ts_eigen_malloc_aligned())
        print("Cling EIGEN_DONT_VECTORIZE=", cppyy.gbl.ts_eigen_dont_vectorize())
        print("Cling glibc version=", cppyy.gbl.ts_glibc_version())
        PY
        printf '%s\n' \
          '#include <eigen3/Eigen/Core>' \
          '#include <iostream>' \
          'int main() {' \
          'std::cout << "C++ EIGEN_MAX_ALIGN_BYTES=" << EIGEN_MAX_ALIGN_BYTES << "\\n";' \
          'std::cout << "C++ EIGEN_MAX_STATIC_ALIGN_BYTES=" << EIGEN_MAX_STATIC_ALIGN_BYTES << "\\n";' \
          'std::cout << "C++ EIGEN_DEFAULT_ALIGN_BYTES=" << EIGEN_DEFAULT_ALIGN_BYTES << "\\n";' \
          'std::cout << "C++ EIGEN_MALLOC_ALREADY_ALIGNED=" << EIGEN_MALLOC_ALREADY_ALIGNED << "\\n";' \
          '#ifdef EIGEN_DONT_VECTORIZE' \
          'std::cout << "C++ EIGEN_DONT_VECTORIZE=1\\n";' \
          '#else' \
          'std::cout << "C++ EIGEN_DONT_VECTORIZE=0\\n";' \
          '#endif' \
          '}' | c++ -O3 -x c++ - -o /tmp/eigen_abi_probe
        /tmp/eigen_abi_probe
    - name: Test PhaseTracer
      continue-on-error: true
      run: cd /home/runner/.TransitionSolver/phasetracer-src && mkdir build && cd build && cmake .. && make && ../bin/unit_tests
    - name: Lint with flake8
      continue-on-error: true
      run: |
        pip install flake8
        # check for Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test CosmoTransitions action
      continue-on-error: true
      run: python -m pytest -vv -s tests/test_action.py::test_action_ct
    - name: Test PhaseTracer action
      run: python -m pytest -vv -s tests/test_action.py::test_action_pt
    - name: Try CLI
      run: ts --model RSS_BP --point input/RSS/RSS_BP1.txt
    - name: Install script test dependencies
      run: |
        mkdir -p config
        echo '{ "PhaseTracer_directory": "/home/runner/.PhaseTracer/" }' > config/config_user.json
    - name: Test script output
      continue-on-error: true
      run: |
        python3 -m examples.command_line_interface rss 1 script_output input/RSS/RSS_BP3.txt
        sed -i '/^\s*"analysisTime"/d' tests/RSS_BP35ab2907aa2a62d9b479c42c639658bf8ef5b197f/phase_history.json script_output/phase_history.json
        numdiff tests/RSS_BP35ab2907aa2a62d9b479c42c639658bf8ef5b197f/phase_history.json script_output/phase_history.json
        numdiff tests/RSS_BP35ab2907aa2a62d9b479c42c639658bf8ef5b197f/phase_structure.dat script_output/phase_structure.dat
    - name: Test more complicated phase history script output
      continue-on-error: true
      run: |
        mkdir -p RSS_new_BP4_output
        python3 -m examples.command_line_interface rss 1 RSS_new_BP4_output input/RSS/RSS_new_BP4.txt
        sed -i '/^\s*"analysisTime"/d' tests/RSS_new_BP4_23_12_2025/phase_history.json RSS_new_BP4_output/phase_history.json
        numdiff tests/RSS_new_BP4_23_12_2025/phase_history.json RSS_new_BP4_output/phase_history.json
        numdiff tests/RSS_new_BP4_23_12_2025/phase_structure.dat RSS_new_BP4_output/phase_structure.dat
    - name: Test pipeline example output
      continue-on-error: true
      run: |
        mkdir -p output/pipeline_example_output
        python3 -m examples.pipeline_example
        sed -i '/^\s*"analysisTime"/d' tests/pipeline_example30_12_2025/phase_history.json output/pipeline_example_output/phase_history.json
        numdiff tests/pipeline_example30_12_2025/phase_history.json output/pipeline_example_output/phase_history.json
        numdiff tests/pipeline_example30_12_2025/phase_structure.dat output/pipeline_example_output/phase_structure.dat
